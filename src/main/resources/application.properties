micronaut.application.name=%serviceSlug%

# HTTP
micronaut.server.port=${PORT:8080}

# Health: /health/liveness and /health/readiness, public (Kubernetes probes), no details in the body
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.health.details-visible=NEVER

# OpenAPI + Swagger UI: public, also in the production image (generated at build time)
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**

# Graceful shutdown on SIGTERM: readiness reports DOWN, then in-flight requests get up to the grace period to finish
micronaut.lifecycle.graceful-shutdown.enabled=true
micronaut.lifecycle.graceful-shutdown.grace-period=${SHUTDOWN_TIMEOUT:20s}
